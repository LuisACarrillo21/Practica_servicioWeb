name: Build Servicio Web Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Construir imagen del servicio web
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/servicio-web:v1 .

      - name: Subir imagen al Container Registry
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/servicio-web:v1
